<h2>Вход</h2>

<form (ngSubmit)="login()">

    <label>Email:</label><br />
    <input [(ngModel)]="email" name="email" type="email"><br>

    <Label>Пароль:</Label><br>
    <input [(ngModel)]="password" name="password" type="password"><br>

    <button type="submit">Войти</button>
</form>

<p *ngIf="error" style="color: red;">{{error}}</p>

<p>
    Нет аккаунта? <a routerLink="/register">Регистрация</a>
</p>
